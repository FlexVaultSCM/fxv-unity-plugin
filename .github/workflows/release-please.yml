name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "Force this exact version (e.g. 1.0.0) instead of the auto-computed bump. Leave blank for normal behavior."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.release.outputs.pr != '' && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          release-as: ${{ github.event_name == 'workflow_dispatch' && inputs.release-as || '' }}
          skip-github-pull-request: ${{ github.event_name == 'push' }}
          skip-github-release: ${{ github.event_name == 'workflow_dispatch' }}


  publish-package:
    name: Build & publish release package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure package version matches GitHub release tag
        run: node .github/scripts/set-version.js "${{ needs.release-please.outputs.tag_name }}"

      - name: Validate version consistency
        run: node .github/scripts/validate-versions.js --tag "${{ needs.release-please.outputs.tag_name }}"

      - name: Build UPM tarball and zip archive
        shell: bash
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          clean_version="${version#v}"

          npm pack

          packed_tgz=$(ls com.flexvault.vcs-*.tgz | head -n 1)
          asset_versioned="com.flexvault.vcs-${clean_version}.tgz"
          asset_latest="com.flexvault.vcs.tgz"
          asset_zip="com.flexvault.vcs-${clean_version}.zip"

          cp "$packed_tgz" "$asset_versioned"
          cp "$packed_tgz" "$asset_latest"

          git archive --format=zip --prefix="com.flexvault.vcs/" HEAD -o "$asset_zip"

          sha256sum "$asset_versioned" > "${asset_versioned}.sha256"
          sha256sum "$asset_latest" > "${asset_latest}.sha256"
          sha256sum "$asset_zip" > "${asset_zip}.sha256"

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          clean_version="${version#v}"
          gh release upload "${version}" \
            "com.flexvault.vcs-${clean_version}.tgz" \
            "com.flexvault.vcs-${clean_version}.tgz.sha256" \
            "com.flexvault.vcs.tgz" \
            "com.flexvault.vcs.tgz.sha256" \
            "com.flexvault.vcs-${clean_version}.zip" \
            "com.flexvault.vcs-${clean_version}.zip.sha256" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Push assets to Cloudflare R2
        if: env.HAS_R2_SECRETS == 'true'
        shell: bash
        env:
          HAS_R2_SECRETS: ${{ secrets.R2_BINARY_RELEASE_BUCKET != '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BINARY_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BINARY_RELEASE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_BINARY_RELEASE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BINARY_RELEASE_BUCKET }}
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          clean_version="${version#v}"
          asset="com.flexvault.vcs-${clean_version}.tgz"
          asset_sha256="$(cut -d' ' -f1 "${asset}.sha256")"

          for key_prefix in "latest" "${version}"; do
            aws s3 cp "com.flexvault.vcs.tgz" "s3://${R2_BUCKET}/fxv-unity-plugin/${key_prefix}/com.flexvault.vcs.tgz" \
              --metadata "sha256=${asset_sha256}" \
              --endpoint-url "${R2_ENDPOINT}"
          done
          aws s3 cp "${asset}" "s3://${R2_BUCKET}/fxv-unity-plugin/${version}/${asset}" \
            --metadata "sha256=${asset_sha256}" \
            --endpoint-url "${R2_ENDPOINT}"
