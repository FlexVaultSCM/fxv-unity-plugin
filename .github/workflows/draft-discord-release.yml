name: Draft Discord Release to Staging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to draft (e.g. v0.2.0). Leave blank for latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  draft-discord-release:
    name: Post Release Draft to Discord
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Format & Send Discord Drafts
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_STAGING_WEBHOOK: ${{ secrets.DISCORD_STAGING_WEBHOOK }}
          DISCORD_FEEDBACK_CHANNEL_ID: ${{ vars.DISCORD_FEEDBACK_CHANNEL_ID }}
        run: |
          TAG_VAL="${{ github.event.inputs.tag || github.event.release.tag_name || '' }}"
          node .github/scripts/send-discord-draft.js \
            --from-gh-release "$TAG_VAL" \
            --product-name "FlexVault Unity Plugin" \
            --docs-url "https://docs.fxv.dev/how-to/unity-plugin"
