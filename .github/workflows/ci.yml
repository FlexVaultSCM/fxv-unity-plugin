name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    name: Validate Package & Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate version consistency
        run: node .github/scripts/validate-versions.js


      - name: Verify companion .meta files
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const targets = ['package.json', 'README.md', 'Editor', 'Tests', 'Runtime'];

            function checkDir(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                if (entry.name.startsWith('.') || entry.name.endsWith('.meta')) continue;
                const fullPath = path.join(dir, entry.name);
                const metaPath = fullPath + '.meta';
                if (!fs.existsSync(metaPath)) {
                  console.error('Missing meta file: ' + fullPath);
                  process.exitCode = 1;
                }
                if (entry.isDirectory()) {
                  checkDir(fullPath);
                }
              }
            }

            for (const target of targets) {
              if (!fs.existsSync(target)) continue;
              const meta = target + '.meta';
              if (!fs.existsSync(meta)) {
                console.error('Missing meta file for target: ' + target);
                process.exitCode = 1;
              }
              const stat = fs.statSync(target);
              if (stat.isDirectory()) {
                checkDir(target);
              }
            }

            if (process.exitCode === 1) {
              console.error('Failed: companion .meta files are missing.');
              process.exit(1);
            }
            console.log('All package assets and directories have valid companion .meta files.');
          "

      - name: Test npm pack (dry-run)
        run: npm pack --dry-run
